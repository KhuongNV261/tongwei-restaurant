name = "tongwei-restaurant"
main = "worker.js"
compatibility_date = "2026-10-22"

[build]
command = "node functions/lib/prepare-assets.cjs"
watch_dir = ["index.html", "assets", "admin", "css", "js", "data"]

[assets]
directory = "./node_modules/.cache/tongwei-public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "tongwei"
# Replace this local placeholder with the D1 database_id for your environment.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
