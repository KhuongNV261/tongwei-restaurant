name = "tongwei-restaurant"
account_id = "0bfa9a89a79407f251cf7f9bddf5cb1f"
main = "worker.js"
compatibility_date = "2026-10-22"

[build]
command = "node functions/lib/prepare-assets.cjs"
watch_dir = ["index.html", "assets", "admin", "css", "js", "data"]

[assets]
directory = "./node_modules/.cache/tongwei-public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "tongwei-db"
database_id = "3a6bd44b-0fec-4a2e-92a1-51a3ff2e70d3"
migrations_dir = "migrations"
