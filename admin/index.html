<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biên tập website · Tong Wei</title>
  <link rel="icon" href="/assets/images/branding/tongwei_avatar.png">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="stylesheet" href="/admin/css/editorial.css">
  <script type="module" src="/admin/js/editorial.js"></script>
</head>
<body class="editorial-home">
  <header class="cms-bar">
    <a class="cms-brand" href="/"><img src="/assets/images/branding/tongwei_badge_transparent.png" width="28" height="35" alt=""> Tong Wei</a>
    <nav aria-label="Liên kết quản trị"><a href="/admin/van-hanh.html">Vận hành nhà hàng</a><a href="/">Xem website ↗</a></nav>
  </header>
  <main class="cms cms-home" id="pane-editorial" aria-labelledby="cmsTitle">
    <header class="cms-header">
      <div>
        <h1 id="cmsTitle">Biên tập website</h1>
        <p>Nội dung, tin tức và liên hệ của khách hàng Tong Wei.</p>
      </div>
      <button type="button" class="btn btn-outline" id="cmsLock" hidden>Khóa phiên biên tập</button>
    </header>
    <nav class="cms-nav" aria-label="Chuyên mục biên tập">
      <button type="button" data-view="site" aria-current="page">Nội dung website</button>
      <button type="button" data-view="events">Tin tức &amp; sự kiện</button>
      <button type="button" data-view="contacts">Hộp thư liên hệ</button>
    </nav>
    <div class="cms-heading">
      <div><h2 id="cmsHeading"></h2><p id="cmsDescription"></p></div>
      <button type="button" class="btn btn-outline" id="cmsReload" hidden>Tải lại</button>
    </div>
    <p id="cmsStatus" role="status" aria-live="polite"></p>
    <form class="cms-card cms-access" id="cmsAccess">
      <label class="cms-field">Mã truy cập quản trị
        <input type="password" name="token" autocomplete="off" required>
      </label>
      <p>Mã do quản trị viên cấp, chỉ dùng trong phiên biên tập này.</p>
      <button type="submit" class="btn btn-indigo">Mở chuyên mục</button>
    </form>
    <div id="cmsContent" hidden></div>
  </main>
</body>
</html>
